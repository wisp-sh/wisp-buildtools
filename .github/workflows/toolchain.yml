name: Build one toolchain

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        required: true
      runner:
        description: JSON runner label array
        type: string
        default: '["ubuntu-24.04"]'
      jobs:
        type: number
        default: 2
      timeout:
        type: number
        default: 360
      llvm-bootstrap:
        description: Restore the verified shared LLVM state from this run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.toolchain }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout }}
    env:
      TOOLCHAIN: ${{ inputs.toolchain }}
      BUILD_TARGET: ${{ inputs.toolchain }}
      PACKAGE_TARGET: ${{ inputs.toolchain }}
      BUILD_JOBS: ${{ inputs.jobs }}
      PACKAGE_DIRECTORY: ${{ github.workspace }}/.ci/packages/${{ inputs.toolchain }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.toolchain == 'assemblyscript'
        with:
          node-version: '24.20.0'
      - name: Prepare disk for Rust source build
        if: inputs.toolchain == 'rust'
        run: |
          df -h . /tmp
          if [ "${RUNNER_ENVIRONMENT:-}" = 'github-hosted' ]; then
            # Rust builds its compiler and matching target libraries.
            # These preinstalled SDKs are unused by this job.
            sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android \
              /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          fi
          df -h . /tmp
          python3 - <<'PY'
          import shutil

          gib = 1024 ** 3
          free = shutil.disk_usage('.').free
          minimum = 15 * gib
          print(f'Rust bootstrap disk available: {free / gib:.1f} GiB', flush=True)
          if free < minimum:
              raise SystemExit('Rust bootstrap requires at least 15 GiB free before installing prerequisites. '
                               'Use a larger runner with the manual workflow runner override.')
          PY
      - name: Download shared Clang and LLVM state
        if: inputs.llvm-bootstrap
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: llvm-bootstrap-state
          path: .ci
      - name: Restore and validate shared Clang and LLVM
        if: inputs.llvm-bootstrap
        run: python3 tools/ci-llvm.py restore .ci/llvm-bootstrap.tar.gz
      - name: Identify execution host cache
        id: host-key
        if: ${{ !inputs.llvm-bootstrap }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          abi = hashlib.sha256(Path('/etc/os-release').read_bytes()).hexdigest()
          version = json.loads(Path('tools/shared-hosts/wasmtime.lock.json').read_text())['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('abi=' + abi + '\n')
              output.write('family=' + version.split('.')[0] + '\n')
              output.write('version=' + version + '\n')
          PY
      - name: Restore native execution host cache
        id: host-cache
        if: steps.host-key.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/hosts/wisp-wasmtime-${{ steps.host-key.outputs.version }}
          key: wisp-host${{ steps.host-key.outputs.family }}-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.host-key.outputs.abi }}-${{ hashFiles('tools/shared-hosts/*.py', 'tools/shared-hosts/*.json', 'tools/shared-hosts/*.patch', 'tools/ci-tools.lock.json') }}
      - name: Install native bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential cmake curl libbrotli1 ninja-build patch pkg-config ripgrep strace unzip xz-utils
          case "$TOOLCHAIN" in
            java|kotlin|jvm|teavm)
              sudo apt-get install --no-install-recommends --yes openjdk-21-jdk-headless
              echo "WISP_BOOTSTRAP_JAVA=/usr/lib/jvm/java-21-openjdk-amd64/bin/java" >> "$GITHUB_ENV"
              ;;
          esac
          python3 tools/ci-prerequisites.py install "$TOOLCHAIN"
      - name: Save verified native execution host
        if: steps.host-cache.outcome == 'success' && steps.host-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci/hosts/wisp-wasmtime-${{ steps.host-key.outputs.version }}
          key: ${{ steps.host-cache.outputs.cache-primary-key }}
      - name: Record build plan
        run: python3 build.py plan "$BUILD_TARGET" --json > .ci/build-plan.json
      - name: Build compiler and dependencies from pinned inputs
        id: compiler-build
        if: ${{ !inputs.llvm-bootstrap }}
        run: |
          set -o pipefail
          python3 build.py build "$BUILD_TARGET" --jobs "$BUILD_JOBS" 2>&1 | tee .ci/build.log
      - name: Build frontend with the shared compiler backend
        id: frontend-build
        if: inputs.llvm-bootstrap && inputs.toolchain != 'clang'
        run: |
          set -o pipefail
          case "$TOOLCHAIN" in
            teavm|java|kotlin|ocaml|goose)
              python3 - <<'PYTHON' > .ci/frontend-order
          import json
          plan = json.load(open('.ci/build-plan.json'))
          print('\n'.join(name for name in plan['order'] if name not in {'clang', 'llvm'}))
          PYTHON
              while read -r target; do
                python3 build.py build "$target" --no-deps --jobs "$BUILD_JOBS"
              done < .ci/frontend-order 2>&1 | tee .ci/build.log
              ;;
            *) python3 build.py build "$TOOLCHAIN" --no-deps --jobs "$BUILD_JOBS" 2>&1 | tee .ci/build.log ;;
          esac
      - name: Show Rust bootstrap failure
        if: failure() && (steps.compiler-build.outcome == 'failure' || steps.frontend-build.outcome == 'failure') && inputs.toolchain == 'rust'
        run: |
          log=rust/build/compiler-source-build-1.99.1/bootstrap.log
          if test -f "$log"; then
            tail -n 100 "$log"
          fi
      - name: Test the Wasm compiler
        run: |
          set -o pipefail
          targets=("$TOOLCHAIN")
          case "$TOOLCHAIN" in
            rust) targets=(rust) ;;
          esac
          for target in "${targets[@]}"; do
            python3 build.py test "$target" 2>&1 | tee ".ci/test-$target.log"
          done
      - name: Package verified compiler
        run: |
          set -o pipefail
          python3 build.py package "$PACKAGE_TARGET" --output-dir "$PACKAGE_DIRECTORY" 2>&1 | tee .ci/package.log
      - name: Validate bundle and report package sizes
        run: |
          targets=("$TOOLCHAIN")
          case "$TOOLCHAIN" in
            rust) targets=(rust) ;;
          esac
          for target in "${targets[@]}"; do
            python3 build.py validate "$PACKAGE_DIRECTORY/$target.wisp.zip" > ".ci/package-validation-$target.json"
          done
          python3 build.py sizes "$PACKAGE_TARGET" --package-dir "$PACKAGE_DIRECTORY"
          cat "$PACKAGE_DIRECTORY/sizes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise installed JavaScript engines and TypeScript checker
        if: inputs.toolchain == 'javascript'
        run: python3 javascript/installed_acceptance.py --packages "$PACKAGE_DIRECTORY" --output .ci/javascript-installed
      - name: Retain JavaScript acceptance evidence
        if: always() && inputs.toolchain == 'javascript'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: javascript-acceptance-evidence
          path: |
            .ci/build.log
            .ci/test-javascript.log
            .ci/package.log
            .ci/javascript-installed/result.json
            .ci/javascript-installed/*/verification.json
            javascript/build/**/verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload compiler package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.toolchain }}-linux-x86_64
          path: |
            ${{ env.PACKAGE_DIRECTORY }}/*.wisp.zip
            ${{ env.PACKAGE_DIRECTORY }}/*.wisp.json
            ${{ env.PACKAGE_DIRECTORY }}/*.wisp.zip.sha256
            ${{ env.PACKAGE_DIRECTORY }}/sizes.html
            ${{ env.PACKAGE_DIRECTORY }}/sizes.md
            ${{ env.PACKAGE_DIRECTORY }}/sizes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
