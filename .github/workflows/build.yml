name: Build all toolchains

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: Compiler to build, or all
        type: choice
        default: all
        options:
          - all
          - clang
          - go
          - grain
          - ocaml
          - goose
          - swift
          - java
          - kotlin
          - jvm
          - teavm
          - llvm-swift
          - llvm
          - rust
          - zig
          - assemblyscript
          - nim
          - javascript
          - python
          - wasm-tools
      runner:
        description: JSON runner labels, use ["self-hosted","linux","x64","buildtools"] for a larger machine
        type: string
        default: '["ubuntu-24.04"]'
      jobs:
        description: Native bootstrap compile jobs, 1 through 8
        type: choice
        default: '2'
        options: ['1', '2', '4', '8']
      release_tag:
        description: Publish the built bundles as a GitHub release with this tag, such as toolchains-2026.10.26. Leave empty to only upload artifacts.
        type: string
        default: ''
      artifacts_run_id:
        description: Republish verified artifacts from a completed Build all toolchains run without rebuilding. Leave empty to build.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  select:
    name: Select toolchains
    if: inputs.artifacts_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      toolchains: ${{ steps.matrix.outputs.toolchains }}
      llvm-toolchains: ${{ steps.matrix.outputs.llvm-toolchains }}
      has-llvm-toolchains: ${{ steps.matrix.outputs.has-llvm-toolchains }}
      has-rust-toolchains: ${{ steps.matrix.outputs.has-rust-toolchains }}
      other-toolchains: ${{ steps.matrix.outputs.other-toolchains }}
      has-other-toolchains: ${{ steps.matrix.outputs.has-other-toolchains }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create matrix from the checked-in manifest
        id: matrix
        env:
          SELECTED_TOOLCHAIN: ${{ inputs.toolchain }}
          RUNNER_LABELS: ${{ inputs.runner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import runpy
          from pathlib import Path

          manifest = json.loads(Path("buildtools.json").read_text())
          selected = os.environ["SELECTED_TOOLCHAIN"]
          tools = list(manifest["tools"]) if selected == "all" else [selected]
          if any(tool not in manifest["tools"] for tool in tools):
              raise SystemExit("Unknown toolchain")
          labels = json.loads(os.environ["RUNNER_LABELS"])
          if not isinstance(labels, list) or not labels or any(not isinstance(label, str) or not label for label in labels):
              raise SystemExit("runner must be a nonempty JSON array of runner labels")
          runpy.run_path("tools/ci-select.py")["write_github_outputs"](tools)
          PY

  compilers:
    name: Build ${{ matrix.toolchain }}
    needs: select
    if: needs.select.outputs.has-other-toolchains == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        toolchain: ${{ fromJSON(needs.select.outputs.other-toolchains) }}
    uses: ./.github/workflows/toolchain.yml
    with:
      toolchain: ${{ matrix.toolchain }}
      runner: ${{ inputs.runner }}
      jobs: ${{ fromJSON(inputs.jobs) }}
      timeout: 360

  rust:
    name: Build Rust with shared LLVM 24
    needs: [select, llvm-bootstrap]
    if: needs.select.outputs.has-rust-toolchains == 'true'
    uses: ./.github/workflows/toolchain.yml
    with:
      toolchain: rust
      runner: ${{ inputs.runner }}
      jobs: ${{ fromJSON(inputs.jobs) }}
      timeout: 360
      llvm-bootstrap: true

  llvm-bootstrap:
    name: Prepare shared Clang and LLVM
    needs: select
    if: needs.select.outputs.has-llvm-toolchains == 'true' || needs.select.outputs.has-rust-toolchains == 'true'
    uses: ./.github/workflows/llvm-bootstrap.yml
    with:
      runner: ${{ inputs.runner }}
      jobs: ${{ fromJSON(inputs.jobs) }}

  llvm-compilers:
    name: Build ${{ matrix.toolchain }}
    needs: [select, llvm-bootstrap]
    if: needs.select.outputs.has-llvm-toolchains == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        toolchain: ${{ fromJSON(needs.select.outputs.llvm-toolchains) }}
    uses: ./.github/workflows/toolchain.yml
    with:
      toolchain: ${{ matrix.toolchain }}
      runner: ${{ inputs.runner }}
      jobs: ${{ fromJSON(inputs.jobs) }}
      timeout: 360
      llvm-bootstrap: true

  # Wisp's approved library build installs compilers from a release, pinned by
  # the SHA-256 of its manifest. Only a complete, successful build publishes.
  release:
    name: Publish toolchain release
    needs: [select, compilers, rust, llvm-bootstrap, llvm-compilers]
    if: ${{ always() && inputs.release_tag != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.release_tag }}
      RELEASE_DIRECTORY: ${{ github.workspace }}/.ci/release
      ARTIFACTS_DIRECTORY: ${{ github.workspace }}/.ci/release-artifacts
      BUILD_RUN_ID: ${{ inputs.artifacts_run_id || github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the completed source build when resuming publication
        if: inputs.artifacts_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release-source.py
      - name: Collect the verified bundles from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: '*-linux-x86_64'
          path: ${{ env.ARTIFACTS_DIRECTORY }}
          merge-multiple: false
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Write the acquisition manifest
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "invalid release tag" >&2; exit 1; }
          python3 tools/release-manifest.py "$RELEASE_DIRECTORY" --artifacts "$ARTIFACTS_DIRECTORY" --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" --commit "$SOURCE_SHA" --output "$RELEASE_DIRECTORY/toolchains-linux-x86_64.json"
          sha256sum "$RELEASE_DIRECTORY/toolchains-linux-x86_64.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RELEASE_DIRECTORY"
          {
            echo "Compiler bundles built by run $BUILD_RUN_ID from $SOURCE_SHA."
            echo
            echo "Pin \`toolchains-linux-x86_64.json\` by SHA-256 and install each bundle with \`wisp toolchain install BUNDLE --sha256 SHA256\`."
            echo
            echo '```'
            sha256sum toolchains-linux-x86_64.json ./*.wisp.zip
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "$TAG" --notes-file notes.md \
            toolchains-linux-x86_64.json ./*.wisp.zip ./*.wisp.json ./*.wisp.zip.sha256
