name: JVM bootstrap acquisition

on:
  push:
    paths:
      - 'jvm/bootstrap.py'
      - 'jvm/toolchain.lock.json'
      - 'jvm/test_bootstrap.py'
      - '.github/workflows/jvm-fetch.yml'
  pull_request:
    paths:
      - 'jvm/bootstrap.py'
      - 'jvm/toolchain.lock.json'
      - 'jvm/test_bootstrap.py'
      - '.github/workflows/jvm-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify retries, atomic rejection and official zlib acquisition
        env:
          WISP_TEST_JVM_DOWNLOADS: '1'
          TMPDIR: ${{ runner.temp }}
        run: python3 jvm/test_bootstrap.py -v
